name: PBT Lab – Auto Grader

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  grade:
    name: Run Tests & Grade
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout student repository ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 ───────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── 3. Build (compile everything) ───────────────────────────────
      - name: Compile
        run: mvn compile test-compile --batch-mode -q

      # ── 4. Run Task 1 ────────────────────────────────────────────────
      - name: "Task 1 – Warmup (read & annotate)"
        run: |
          mvn test --batch-mode -Dtest=Task1_WarmupTest \
              -Dsurefire.failIfNoSpecifiedTests=false \
              2>&1 | tee task1.log
          echo "## Task 1 Result" >> $GITHUB_STEP_SUMMARY
          if grep -q "BUILD SUCCESS" task1.log; then
            echo "✅ All Task 1 properties pass." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Task 1 has failures. See log above." >> $GITHUB_STEP_SUMMARY
          fi

      # ── 5. Run Task 2 ────────────────────────────────────────────────
      - name: "Task 2 – countOccurrences() properties"
        run: |
          mvn test --batch-mode -Dtest=Task2_CountOccurrencesTest \
              -Dsurefire.failIfNoSpecifiedTests=false \
              2>&1 | tee task2.log
          echo "## Task 2 Result" >> $GITHUB_STEP_SUMMARY
          PASS=$(grep -c "Tests run:.*Failures: 0, Errors: 0" task2.log || true)
          FAIL=$(grep -c "FAILED\|ERROR" task2.log || true)
          echo "- Passing property methods : $PASS" >> $GITHUB_STEP_SUMMARY
          echo "- Failing / error          : $FAIL" >> $GITHUB_STEP_SUMMARY

      # ── 6. Run Task 3 ────────────────────────────────────────────────
      - name: "Task 3 – BoundedStack properties"
        run: |
          mvn test --batch-mode -Dtest=Task3_BoundedStackTest \
              -Dsurefire.failIfNoSpecifiedTests=false \
              2>&1 | tee task3.log
          echo "## Task 3 Result" >> $GITHUB_STEP_SUMMARY
          if grep -q "BUILD SUCCESS" task3.log; then
            echo "✅ All Task 3 properties pass." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Task 3 has failures. See log above." >> $GITHUB_STEP_SUMMARY
          fi

      # ── 7. Run Task 4 ────────────────────────────────────────────────
      # Task 4 tests are EXPECTED to fail against BuggyCalculator.
      # We verify they compile and run (not that they pass).
      # The instructor's hidden tests confirm bug-detection quality.
      - name: "Task 4 – Bug detection (BuggyCalculator)"
        run: |
          mvn test --batch-mode -Dtest=Task4_BuggyCalculatorTest \
              -Dsurefire.failIfNoSpecifiedTests=false \
              2>&1 | tee task4.log || true   # allow failure — bugs are intentional
          echo "## Task 4 Result" >> $GITHUB_STEP_SUMMARY
          FOUND=$(grep -c "PropertyFailureException\|AssertionError\|counterexample" task4.log || true)
          echo "- Bugs detected by your properties: $FOUND" >> $GITHUB_STEP_SUMMARY
          if [ "$FOUND" -ge 2 ]; then
            echo "✅ At least 2 bugs detected — well done!" >> $GITHUB_STEP_SUMMARY
          elif [ "$FOUND" -ge 1 ]; then
            echo "⚠️  Only 1 bug detected — try to find more." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No bugs detected yet — review your properties." >> $GITHUB_STEP_SUMMARY
          fi

      # ── 8. Run Task 5 ────────────────────────────────────────────────
      - name: "Task 5 – Free design task"
        run: |
          mvn test --batch-mode -Dtest=Task5_FreeTaskTest \
              -Dsurefire.failIfNoSpecifiedTests=false \
              2>&1 | tee task5.log
          echo "## Task 5 Result" >> $GITHUB_STEP_SUMMARY
          PROPS=$(grep -c "@Property" src/test/java/lab/Task5_FreeTaskTest.java || true)
          echo "- @Property methods found: $PROPS" >> $GITHUB_STEP_SUMMARY
          if grep -q "BUILD SUCCESS" task5.log; then
            echo "✅ All Task 5 properties pass." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Task 5 has failures." >> $GITHUB_STEP_SUMMARY
          fi

      # ── 9. Upload test reports as artifact ───────────────────────────
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      # ── 10. Final summary badge ───────────────────────────────────────
      - name: Final summary
        if: always()
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Task | File |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Task 1 | Task1_WarmupTest.java |" >> $GITHUB_STEP_SUMMARY
          echo "| Task 2 | Task2_CountOccurrencesTest.java |" >> $GITHUB_STEP_SUMMARY
          echo "| Task 3 | Task3_BoundedStackTest.java |" >> $GITHUB_STEP_SUMMARY
          echo "| Task 4 | Task4_BuggyCalculatorTest.java |" >> $GITHUB_STEP_SUMMARY
          echo "| Task 5 | Task5_FreeTaskTest.java |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_See the Actions tab for details on each task._" >> $GITHUB_STEP_SUMMARY
